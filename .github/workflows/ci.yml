name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - run: uv sync
      - run: uv run pytest -q

      # hooks/*.test.sh・distill/weekly-distill.test.sh を精査し、Ubuntu ランナーで
      # 動かない要素（pgrep/BSD系コマンド差異等）を確認した:
      #   - archive-session.sh の pgrep 呼び出しはテスト内でPATHスタブに差し替え済みで、
      #     実pgrepのGNU/BSD差異は踏まない。
      #   - weekly-distill.sh は /usr/bin/osascript を呼ぶが `|| true` で握り潰されており、
      #     Ubuntu上でコマンド不在(exit 127)でもテスト結果に影響しない
      #     （テスト自体も .weekly.log の内容のみを検証し、通知呼び出しは検証対象外）。
      #   - date -v / stat -f 等のBSD専用コマンドは3スクリプトいずれにも使用なし。
      # 除外が必要な要素は見つからなかったため、3本とも実行対象に含める。
      - name: check-setup hook test
        run: bash hooks/check-setup.test.sh

      - name: archive-session hook test
        run: bash hooks/archive-session.test.sh

      - name: weekly-distill test
        run: bash distill/weekly-distill.test.sh

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # リポジトリ直下の .gitleaks.toml（tests/ 配下のダミー秘密情報フィクスチャの
      # allowlist）は、gitleaks-action が --config を渡さない場合に gitleaks CLI 自身が
      # target path 直下から自動検出する既定挙動（公式README「order of precedence」の
      # 4番目）に従うため、config パス指定は不要。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
